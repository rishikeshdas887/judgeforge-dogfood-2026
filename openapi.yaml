openapi: 3.0.3
info:
  title: JudgeForge DOGFOOD 2026 API
  version: 1.1.0
  description: >-
    Published API contract for the JudgeForge DOGFOOD 2026 portal. The contract
    documents the business actions exposed by the web UI as well as the public
    T4 read API, organizer integrations, certificates, signed judge records,
    and bulk project import/export. The session cookie is the same local
    browser session used by the web application; no external auth provider is
    required.
servers:
  - url: http://localhost:8080
    description: Local Docker deployment

tags:
  - name: Authentication
  - name: Public
  - name: Participant
  - name: Judge
  - name: Organizer
  - name: Community
  - name: Audit
  - name: T4 Integrations

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Local portal session cookie.

  schemas:
    Error:
      type: object
      additionalProperties: true
      properties:
        error:
          type: string
        message:
          type: string

    AuthUser:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        username:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [ADMIN, ORGANIZER, JUDGE, PARTICIPANT]

    LoginResponse:
      type: object
      additionalProperties: true
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        authenticated:
          type: boolean

    Track:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    Prize:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        amount:
          type: number
        description:
          type: string

    CustomQuestion:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
        required:
          type: boolean

    Event:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        startsAt:
          type: string
          format: date-time
        submissionsCloseAt:
          type: string
          format: date-time
        judgingStartsAt:
          type: string
          format: date-time
        judgingEndsAt:
          type: string
          format: date-time
        resultsPublishAt:
          type: string
          format: date-time
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/Track'
        prizes:
          type: array
          items:
            $ref: '#/components/schemas/Prize'
        customQuestions:
          type: array
          items:
            $ref: '#/components/schemas/CustomQuestion'

    EventCreate:
      allOf:
        - $ref: '#/components/schemas/Event'

    Team:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        inviteToken:
          type: string
        members:
          type: array
          items:
            type: object
            additionalProperties: true

    TeamCreate:
      type: object
      required: [name]
      additionalProperties: true
      properties:
        name:
          type: string

    Invite:
      type: object
      additionalProperties: true
      properties:
        token:
          type: string
        teamId:
          type: string
        expiresAt:
          type: string
          format: date-time

    Project:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        trackId:
          type: string
        teamId:
          type: string
        repositoryUrl:
          type: string
        demoUrl:
          type: string
        status:
          type: string
        submittedAt:
          type: string
          format: date-time

    ProjectCreate:
      type: object
      required: [title]
      additionalProperties: true
      properties:
        title:
          type: string
        description:
          type: string
        trackId:
          type: string
        teamId:
          type: string
        repositoryUrl:
          type: string
        demoUrl:
          type: string

    ProjectUpdate:
      type: object
      additionalProperties: true
      properties:
        title:
          type: string
        description:
          type: string
        trackId:
          type: string
        teamId:
          type: string
        repositoryUrl:
          type: string
        demoUrl:
          type: string

    RubricCriterion:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        weight:
          type: number
        maxScore:
          type: number

    Rubric:
      type: object
      additionalProperties: true
      properties:
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/RubricCriterion'

    Ballot:
      type: object
      additionalProperties: true
      properties:
        projectId:
          type: string
        judgeId:
          type: string
        scores:
          type: object
          additionalProperties:
            type: number
        updatedAt:
          type: string
          format: date-time

    ScoreSubmission:
      type: object
      required: [scores]
      additionalProperties: true
      properties:
        scores:
          type: object
          additionalProperties:
            type: number

    Judge:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        status:
          type: string
        assignmentCount:
          type: integer

    BatchAssignmentRequest:
      type: object
      additionalProperties: true
      properties:
        assignments:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              judgeId:
                type: string
              projectId:
                type: string

    AutoAssignmentRequest:
      type: object
      additionalProperties: true
      properties:
        judgeCount:
          type: integer
        assignmentsPerProject:
          type: integer

    VotingConfig:
      type: object
      additionalProperties: true
      properties:
        accessMode:
          type: string
          enum: [OPEN_LINK, EMAIL_GATED, AUTHENTICATED]
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        resultsHiddenUntilClose:
          type: boolean
        rateLimitPerMinute:
          type: integer

    VoteRequest:
      type: object
      additionalProperties: true
      properties:
        projectId:
          type: string
        email:
          type: string

    CommentRequest:
      type: object
      required: [projectId, text]
      additionalProperties: true
      properties:
        projectId:
          type: string
        text:
          type: string
        email:
          type: string

    NormalizationResult:
      type: object
      additionalProperties: true
      properties:
        normalizationVersion:
          type: string
        generatedAt:
          type: string
          format: date-time
        eligibleBallots:
          type: integer
        minimumSampleSize:
          type: integer
        inputFingerprint:
          type: string
        results:
          type: array
          items:
            type: object
            additionalProperties: true

    WebhookRegistration:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        secret:
          type: string
        events:
          type: array
          items:
            type: string

    Certificate:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        projectId:
          type: string
        certificateUrl:
          type: string
        issuedAt:
          type: string
          format: date-time

    SignedJudgeRecord:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        judgeId:
          type: string
        payload:
          type: object
          additionalProperties: true
        signature:
          type: string
        publicKeyId:
          type: string

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or session is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated session lacks permission for the action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request conflicts with current state, such as a closed event or duplicate action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get the current session user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current authentication/session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Start a local session for a portal role
      operationId: login
      parameters:
        - name: role
          in: query
          required: true
          schema:
            type: string
            enum: [admin, organizer, judge, participant]
      responses:
        '200':
          description: Session established.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: End the current session
      operationId: logout
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Session ended.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects:
    get:
      tags: [Public]
      summary: List projects in the public gallery
      operationId: listGalleryProjects
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: track
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Searchable project gallery.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'

  /projects/new:
    post:
      tags: [Public]
      summary: Submission-path acceptance probe
      description: Kept for the repository acceptance suite; a closed event must reject this route.
      operationId: submissionAcceptanceProbe
      responses:
        '200':
          description: Route accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/results/published:
    get:
      tags: [Public]
      summary: Read published results
      operationId: getPublishedResults
      responses:
        '200':
          description: Public published result snapshot.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/participant/event:
    get:
      tags: [Participant]
      summary: Read event configuration as a participant
      operationId: getParticipantEvent
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Event visible to a participant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/teams:
    get:
      tags: [Participant]
      summary: List teams available to the current participant
      operationId: listTeams
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Teams.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Participant]
      summary: Create a team
      operationId: createTeam
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreate'
      responses:
        '200':
          description: Team created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/teams/{teamId}/invites:
    post:
      tags: [Participant]
      summary: Create a team invite
      operationId: createTeamInvite
      security:
        - sessionCookie: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invite created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/teams/invites/{token}/accept:
    post:
      tags: [Participant]
      summary: Accept a team invite
      operationId: acceptTeamInvite
      security:
        - sessionCookie: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invite accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/mine:
    get:
      tags: [Participant]
      summary: List the current participant's projects
      operationId: listMyProjects
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Participant-owned projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects:
    post:
      tags: [Participant]
      summary: Create a project draft
      operationId: createProject
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '200':
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/projects/{projectId}:
    put:
      tags: [Participant]
      summary: Edit a project draft
      operationId: updateProject
      security:
        - sessionCookie: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Project updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{projectId}/submit:
    post:
      tags: [Participant]
      summary: Submit a project
      operationId: submitProject
      security:
        - sessionCookie: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/judge/projects:
    get:
      tags: [Judge]
      summary: List projects assigned to the current judge
      operationId: listJudgeProjects
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Assigned projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/judge/rubric:
    get:
      tags: [Judge]
      summary: Read the active judging rubric
      operationId: getJudgeRubric
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Rubric.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rubric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/judge/ballots:
    get:
      tags: [Judge]
      summary: Read the current judge's ballots
      operationId: getJudgeBallots
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Judge-local ballots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ballot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/judge/ballots/{projectId}:
    put:
      tags: [Judge]
      summary: Save or update the current judge's ballot
      operationId: saveJudgeBallot
      security:
        - sessionCookie: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreSubmission'
      responses:
        '200':
          description: Ballot saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ballot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/judge/scores:
    get:
      tags: [Judge]
      summary: Read judge score data under role isolation rules
      description: Used by the official acceptance suite to verify own-score visibility and peer-score blocking.
      operationId: getJudgeScores
      security:
        - sessionCookie: []
      parameters:
        - name: judge
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Permitted score view.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ballot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/organizer/event:
    get:
      tags: [Organizer]
      summary: Read event configuration
      operationId: getOrganizerEvent
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Event configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Organizer]
      summary: Update event configuration
      operationId: updateOrganizerEvent
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Event updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/organizer/events:
    post:
      tags: [Organizer]
      summary: Create an event
      operationId: createEvent
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '200':
          description: Event created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/organizer/rubric:
    get:
      tags: [Organizer]
      summary: Read organizer judging rubric
      operationId: getOrganizerRubric
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current rubric.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rubric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Organizer]
      summary: Update judging rubric
      operationId: updateOrganizerRubric
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rubric'
      responses:
        '200':
          description: Rubric updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rubric'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/organizer/judges:
    get:
      tags: [Organizer]
      summary: List judges
      operationId: listJudges
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Judges.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Judge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/organizer/judges/{judgeId}/invite:
    post:
      tags: [Organizer]
      summary: Invite a judge
      operationId: inviteJudge
      security:
        - sessionCookie: []
      parameters:
        - name: judgeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation updated/sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Judge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/organizer/judges/{judgeId}/assignments:
    put:
      tags: [Organizer]
      summary: Replace assignments for one judge
      operationId: assignJudgeProjects
      security:
        - sessionCookie: []
      parameters:
        - name: judgeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                projectIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Assignments saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/organizer/judges/assignments/batch:
    post:
      tags: [Organizer]
      summary: Create batch judge assignments
      operationId: batchAssignJudges
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAssignmentRequest'
      responses:
        '200':
          description: Batch assignment result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
