<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>DogFood Project Gallery</title>
  <style>
    :root {
      color-scheme: light;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
    }

    .wrapper {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 18px;
    }

    .title {
      margin: 0;
      font-size: 24px;
      font-weight: 750;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 5px 0 0;
      color: #64748b;
      font-size: 13px;
    }

    .count {
      color: #475569;
      font-size: 13px;
      white-space: nowrap;
    }

    .status {
      padding: 16px;
      border-radius: 14px;
      background: white;
      border: 1px solid #e2e8f0;
      color: #475569;
    }

    .status.error {
      color: #991b1b;
      border-color: #fecaca;
      background: #fef2f2;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow:
        0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .card-body {
      padding: 16px;
    }

    .track {
      display: inline-block;
      margin-bottom: 8px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 11px;
      font-weight: 700;
    }

    .card h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.3;
    }

    .card p {
      margin: 8px 0 0;
      color: #64748b;
      font-size: 13px;
      line-height: 1.55;
    }

    .repo {
      display: inline-block;
      margin-top: 14px;
      color: #2563eb;
      font-size: 12px;
      font-weight: 650;
      text-decoration: none;
    }

    .repo:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <header class="header">
      <div>
        <h1 class="title">DogFood Project Gallery</h1>
        <p class="subtitle">
          Submitted projects from the public API.
        </p>
      </div>
      <div
        id="count"
        class="count"
      ></div>
    </header>

    <section
      id="status"
      class="status"
      aria-live="polite"
    >
      Loading projects…
    </section>

    <section
      id="grid"
      class="grid"
      aria-live="polite"
    ></section>
  </main>

  <script>
    const params = new URLSearchParams(
      window.location.search
    );

    const apiBase =
      params.get("api") || "/api/v1/projects";

    const search =
      params.get("search");

    const track =
      params.get("track");

    const status =
      document.getElementById("status");

    const grid =
      document.getElementById("grid");

    const count =
      document.getElementById("count");

    function createText(tag, text, className) {
      const node = document.createElement(tag);

      if (className) {
        node.className = className;
      }

      node.textContent = text || "";

      return node;
    }

    function projectCard(project) {
      const card =
        document.createElement("article");

      card.className = "card";

      const body =
        document.createElement("div");

      body.className = "card-body";

      const trackNode =
        createText(
          "span",
          project.track || "Project",
          "track"
        );

      const title =
        createText(
          "h2",
          project.title || project.name || "Untitled"
        );

      const description =
        createText(
          "p",
          project.summary ||
            project.long_description ||
            "No description provided."
        );

      body.append(trackNode);
      body.append(title);
      body.append(description);

      if (project.repository_url || project.repo_url) {
        const link =
          document.createElement("a");

        link.className = "repo";
        link.href =
          project.repository_url ||
          project.repo_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "View repository";

        body.append(link);
      }

      card.append(body);

      return card;
    }

    async function load() {
      try {
        const url =
          new URL(
            apiBase,
            window.location.origin
          );

        if (search) {
          url.searchParams.set(
            "search",
            search
          );
        }

        if (track) {
          url.searchParams.set(
            "track",
            track
          );
        }

        const response =
          await fetch(url.toString(), {
            headers: {
              Accept: "application/json"
            }
          });

        if (!response.ok) {
          throw new Error(
            `API returned ${response.status}`
          );
        }

        const projects =
          await response.json();

        if (!Array.isArray(projects)) {
          throw new Error(
            "API returned an invalid project list"
          );
        }

        grid.replaceChildren();

        count.textContent =
          `${projects.length} project${
            projects.length === 1 ? "" : "s"
          }`;

        if (projects.length === 0) {
          status.hidden = false;
          status.textContent =
            "No submitted projects found.";
          return;
        }

        status.hidden = true;

        for (const project of projects) {
          grid.append(
            projectCard(project)
          );
        }
      } catch (error) {
        status.hidden = false;
        status.className =
          "status error";
        status.textContent =
          `Could not load projects: ${error.message}`;
      }
    }

    load();
  </script>
</body>
</html>
