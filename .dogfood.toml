[portal]
base_url = "http://localhost:8080"

[tiers]
claimed = ["T1", "T2", "T3", "T4"]
pitch = "A self-hosted, offline-first hackathon portal: event creation, teams and submissions, automatic judge assignment, role-isolated weighted scoring with deterministic cross-judge normalization and pairwise (Bradley-Terry) judging, append-only audit log, community voting with anti-abuse controls, REST/webhooks, certificates, signed records, embeds and bulk tools. One command to run."

[auth]
organizer   = "Cookie: session=org_7f2a"
judge_a     = "Cookie: session=jdg_a_91bc"
judge_b     = "Cookie: session=jdg_b_44de"
participant = "Cookie: session=prt_2e88"

[routes]
gallery      = "/projects"
submit       = "/projects/new"
judge_scores = "/api/judge/scores"
peer_scores  = "/api/judge/scores?judge=judge_a"
csv_export   = "/api/export.csv"
